name: Release

# Automates the GitHub-first release flow from docs/release.md on a `v*` tag push:
#   1. build + verify (pytest gate so a broken tag never ships)
#   2. create the GitHub Release from docs/releases/<tag>.md with dist assets
#   3. optionally publish to PyPI via Trusted Publishing (OIDC)
#
# To complete Stage 2, configure a PyPI pending publisher (one-time, on PyPI):
#   project: agentcli-py · owner: saintiron82 · repo: agentcli
#   workflow: release.yml · environment: pypi
# After setup, opt in with the repository variable PYPI_PUBLISH_ENABLED=true.
# Prefer a token instead? Drop the `permissions.id-token` + `environment` from
# pypi-publish and pass `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish
# step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dev environment
        run: python -m pip install -e ".[dev]"

      - name: Run test suite (release gate)
        run: python -m pytest

      - name: Build distributions
        run: |
          rm -rf dist/
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: publish to PyPI
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentcli-py
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: GitHub Release
    # GitHub packages remain available even when PyPI is disabled or unavailable.
    # Both publication paths still require successful tests/build validation.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Publish Korean notes when available; retain English-only releases.
          notes="docs/releases/${TAG}.ko.md"
          if [ ! -f "$notes" ]; then
            notes="docs/releases/${TAG}.md"
          fi
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

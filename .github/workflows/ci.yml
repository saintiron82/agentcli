name: CI

# Promotes the local `release-check` gate (pytest → build → twine check) to CI.
# Proves the multi-version / multi-OS support claimed in README.md and
# pyproject.toml classifiers (Python 3.11–3.14 on macOS + Linux). Windows
# support is claimed and manually verified (#27), but a CI leg was tried and
# removed same-day (#65): free-tier windows runners queued 30min+ per run,
# blocking every PR. The test suite stays Windows-clean (encoding/.cmd
# launchers/skipifs from #66) so the leg can return if runner latency is
# ever acceptable (e.g. nightly-only or self-hosted). The separate
# windows-security.yml workflow provides an explicit Windows regression gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Tag pushes (v*) are handled by release.yml, which runs its own build gate —
  # no need to duplicate the full matrix here.

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev environment
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest

  build:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dev environment
        run: python -m pip install -e ".[dev]"

      - name: Build distributions
        run: |
          rm -rf dist/
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
